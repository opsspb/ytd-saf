<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded rectangle background -->
  <rect width="1024" height="1024" rx="228" fill="url(#bgGradient)"/>
  
  <!-- Download arrow -->
  <g transform="translate(512, 512)">
    <!-- Arrow shaft -->
    <rect x="-80" y="-280" width="160" height="400" rx="20" fill="white"/>
    
    <!-- Arrow head -->
    <path d="M -240,120 L 0,360 L 240,120 L 140,120 L 140,-100 L -140,-100 L -140,120 Z" fill="white"/>
  </g>
  
  <!-- YD text -->
  <text x="512" y="850" font-family="Arial, sans-serif" font-size="180" font-weight="bold" fill="white" text-anchor="middle">YD</text>
</svg>
