<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YD Safari click verify</title>
    <link rel="stylesheet" href="../YTDownloader/YTDownloaderExtension/Resources/styles.css">
    <style>
        html, body { margin: 0; padding: 20px; font-family: Roboto, sans-serif; background: #111; color: #fff; }
        #top-level-buttons-computed { display: none; }
        #actions-inner { display: flex; align-items: center; height: 80px; gap: 8px; }
        like-button-view-model, yt-button-view-model {
            display: inline-flex; align-items: center; height: 36px; padding: 0 12px;
            background: #272727; border-radius: 18px;
        }
        #ytd-download-button { width: 220px !important; height: 72px !important; font-size: 28px !important; }
        .ytd-card-download-button { width: 220px !important; height: 72px !important; font-size: 28px !important; }
        .ytLockupMetadataViewModelAvatar { width: 36px; height: 36px; background: #666; border-radius: 50%; }
        yt-lockup-view-model { display: block; margin-top: 40px; }
    </style>
</head>
<body>
    <ytd-watch-metadata>
        <div id="actions">
            <div id="actions-inner">
                <like-button-view-model>Like</like-button-view-model>
                <yt-button-view-model>Share</yt-button-view-model>
                <yt-button-view-model>Save</yt-button-view-model>
            </div>
        </div>
    </ytd-watch-metadata>
    <ytd-rich-item-renderer>
        <yt-lockup-view-model>
            <a class="ytLockupViewModelContentImage" href="/watch?v=safariCard99">thumb</a>
            <div class="ytLockupMetadataViewModelAvatar"></div>
        </yt-lockup-view-model>
    </ytd-rich-item-renderer>
    <script>window.__YTD_TEST__ = true;</script>
    <script src="../YTDownloader/YTDownloaderExtension/Resources/content.js"></script>
    <script>
        history.replaceState({}, '', '?v=safariWatch99');
        YTD.refresh();
    </script>
</body>
</html>
