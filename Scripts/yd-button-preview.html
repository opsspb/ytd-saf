<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YD button visual preview</title>
    <link rel="stylesheet" href="../YTDownloader/YTDownloaderExtension/Resources/styles.css">
    <style>
        :root {
            --yt-spec-text-primary: #0f0f0f;
            --yt-spec-additive-background: rgba(0, 0, 0, 0.05);
            --yt-spec-10-percent-layer: rgba(0, 0, 0, 0.1);
            --yt-spec-base-background: #fff;
        }
        body { margin: 0; font-family: "Roboto", Arial, sans-serif; background: #f8f8f8; color: #0f0f0f; }
        h2 { margin: 0 0 16px; font-size: 18px; }
        section { background: #fff; margin: 16px; padding: 20px; border-radius: 12px; }
        .actions { display: flex; align-items: center; height: 36px; }
        .yt-action {
            height: 36px; border: none; border-radius: 18px; padding: 0 16px;
            background: rgba(0,0,0,0.05); font: 500 14px Roboto, sans-serif; margin-right: 8px;
        }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .thumb { height: 110px; background: #ccc; border-radius: 12px; }
        .meta { display: flex; gap: 10px; margin-top: 10px; }
        .ytLockupMetadataViewModelAvatar {
            width: 36px; height: 36px; background: #bbb; border-radius: 50%; flex: 0 0 auto;
            overflow: hidden;
        }
        .title { font-weight: 600; font-size: 14px; }
        .channel { color: #606060; font-size: 12px; margin-top: 4px; }
    </style>
</head>
<body>
    <section id="watch-preview">
        <h2>Watch page actions</h2>
        <div id="top-level-buttons-computed" class="actions">
            <button class="yt-action" type="button">Like</button>
            <button class="yt-action" type="button">Share</button>
        </div>
    </section>
    <section id="home-preview">
        <h2>Home feed cards</h2>
        <div class="grid" id="home-grid"></div>
    </section>
    <script>window.__YTD_TEST__ = true;</script>
    <script src="../YTDownloader/YTDownloaderExtension/Resources/content.js"></script>
    <script>
        history.replaceState({}, '', '?v=watchVideo1');
        ['alphaVideo1', 'betaVideo12', 'gammaVid123'].forEach((id, i) => {
            const card = document.createElement('ytd-rich-item-renderer');
            card.innerHTML = `
                <yt-lockup-view-model>
                    <a class="ytLockupViewModelContentImage" href="/watch?v=${id}">
                        <div class="thumb"></div>
                    </a>
                    <div class="meta">
                        <div class="ytLockupMetadataViewModelAvatar"></div>
                        <div>
                            <a class="ytLockupMetadataViewModelTitle" href="/watch?v=${id}">Sample video ${i + 1}</a>
                            <div class="channel">Channel ${i + 1}</div>
                        </div>
                    </div>
                </yt-lockup-view-model>`;
            document.getElementById('home-grid').appendChild(card);
        });
        YTD.refresh();
    </script>
</body>
</html>
