name: Build and Test

on:
  push:
    branches: [ main, cursor/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
    
    - name: Run Swift package tests
      run: |
        cd YTDownloaderCore
        swift test --parallel

    - name: Run content script tests
      run: swift Scripts/run-content-tests.swift
    
    - name: Build app
      run: |
        xcodebuild clean build \
          -project YTDownloader.xcodeproj \
          -scheme YTDownloader \
          -configuration Debug \
          -destination 'platform=macOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

  test-core:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run YTDownloaderCore tests
      run: |
        cd YTDownloaderCore
        swift test --parallel --enable-code-coverage
    
    - name: Generate coverage report
      run: |
        cd YTDownloaderCore
        xcrun llvm-cov export \
          .build/debug/YTDownloaderCorePackageTests.xctest/Contents/MacOS/YTDownloaderCorePackageTests \
          -instr-profile .build/debug/codecov/default.profdata \
          -format=lcov > coverage.lcov
      continue-on-error: true
  
  integration-test:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install yt-dlp and ffmpeg
      run: brew install yt-dlp ffmpeg
    
    - name: Check if YouTube is accessible
      id: youtube_check
      continue-on-error: true
      run: |
        echo "Checking YouTube accessibility..."
        yt-dlp -J --no-warnings "https://www.youtube.com/watch?v=dQw4w9WgXcQ" > /tmp/video_info.json
        echo "accessible=true" >> $GITHUB_OUTPUT
    
    - name: Test format selection on real YouTube video
      if: steps.youtube_check.outputs.accessible == 'true'
      run: |
        echo "Video info fetched successfully"
        
        # Test format selection with real data using swift build + script
        cd YTDownloaderCore
        swift build
        
        # Create simple test script that uses the built module
        cat > /tmp/test_format_selection.swift << 'EOF'
        import Foundation
        import YTDownloaderCore
        
        let data = try Data(contentsOf: URL(fileURLWithPath: "/tmp/video_info.json"))
        let info = try JSONDecoder().decode(YTDLPInfo.self, from: data)
        
        print("Video: \(info.title)")
        print("Total formats: \(info.formats.count)")
        
        let selector = FormatSelector()
        let selected = try selector.selectBestFormats(from: info)
        
        print("Selected video format: \(selected.video.formatId) - \(selected.video.resolution ?? "unknown") @ \(selected.video.fps ?? 0)fps")
        print("Selected audio format: \(selected.audio.formatId) - \(selected.audio.abr ?? 0)kbps (\(selected.audio.language ?? "unknown"))")
        
        guard selected.video.hasVideo && selected.audio.hasAudio else {
            print("ERROR: Invalid format selection")
            exit(1)
        }
        
        print("✓ Format selection test: PASSED")
        EOF
        
        # Run with the built module
        swiftc -I .build/debug -L .build/debug -lYTDownloaderCore /tmp/test_format_selection.swift -o /tmp/test_format_selection
        /tmp/test_format_selection
    
    - name: Skip integration test if YouTube is not accessible
      if: steps.youtube_check.outputs.accessible != 'true'
      run: |
        echo "⚠️  Skipping integration test: YouTube is not accessible from CI runner"
        echo "This is expected behavior. Format selection logic is tested in unit tests."
        echo "status=skipped" >> $GITHUB_OUTPUT
