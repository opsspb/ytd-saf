name: Build and Test

on:
  push:
    branches: [ main, cursor/*, v2-* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
    
    - name: Run Swift package tests
      run: |
        cd YTDownloaderCore
        swift test --parallel

    - name: Run content script tests
      run: |
        swift Scripts/run-content-tests.swift
        swift Scripts/run-content-tests.swift YTDownloader/YTDownloaderExtension/Resources/vk.test.html
    
    - name: Build app
      run: |
        # No signing identity on CI / agent accounts: override team signing from the project.
        xcodebuild clean build \
          -project YTDownloader.xcodeproj \
          -scheme YTDownloader \
          -configuration Debug \
          -destination 'platform=macOS' \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM=

  test-core:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run YTDownloaderCore tests
      run: |
        cd YTDownloaderCore
        swift test --parallel --enable-code-coverage
    
    - name: Generate coverage report
      run: |
        cd YTDownloaderCore
        xcrun llvm-cov export \
          .build/debug/YTDownloaderCorePackageTests.xctest/Contents/MacOS/YTDownloaderCorePackageTests \
          -instr-profile .build/debug/codecov/default.profdata \
          -format=lcov > coverage.lcov
      continue-on-error: true
  
  integration-test:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install yt-dlp and ffmpeg
      run: brew install yt-dlp ffmpeg
    
    - name: Check if YouTube is accessible
      id: youtube_check
      continue-on-error: true
      run: |
        echo "Checking YouTube accessibility..."
        yt-dlp -J --no-warnings "https://www.youtube.com/watch?v=dQw4w9WgXcQ" > /tmp/video_info.json
        echo "accessible=true" >> $GITHUB_OUTPUT
    
    - name: Test format selection on real YouTube video
      if: steps.youtube_check.outputs.accessible == 'true'
      run: |
        python3 - <<'PY'
        import json
        info = json.load(open("/tmp/video_info.json"))
        print("Video:", info.get("title"))
        print("Total formats:", len(info.get("formats") or []))
        vids = [f for f in info.get("formats", []) if f.get("vcodec") not in (None, "none") and f.get("acodec") in (None, "none") and f.get("height")]
        auds = [f for f in info.get("formats", []) if f.get("acodec") not in (None, "none") and f.get("vcodec") in (None, "none")]
        if not vids or not auds:
            raise SystemExit("no separable video/audio formats in live JSON")
        def vkey(f):
            return (f.get("height") or 0, f.get("fps") or 0, f.get("vbr") or f.get("tbr") or 0)
        def akey(f):
            return (f.get("language_preference") if f.get("language_preference") is not None else -1, f.get("abr") or f.get("tbr") or 0)
        best_v = max(vids, key=vkey)
        best_a = max(auds, key=akey)
        print("Selected video:", best_v.get("format_id"), best_v.get("height"), "p", best_v.get("fps"), "fps")
        print("Selected audio:", best_a.get("format_id"), best_a.get("abr"), "kbps", best_a.get("language"))
        print("✓ Live yt-dlp JSON is usable for format selection")
        PY
        cd YTDownloaderCore
        swift test --filter FormatSelectorTests
    
    - name: Skip integration test if YouTube is not accessible
      if: steps.youtube_check.outputs.accessible != 'true'
      run: |
        echo "⚠️  Skipping integration test: YouTube is not accessible from CI runner"
        echo "This is expected behavior. Format selection logic is tested in unit tests."
        echo "status=skipped" >> $GITHUB_OUTPUT
